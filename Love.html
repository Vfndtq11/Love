<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>I love you Karina ❤</title>
<style>
  html, body {
      margin: 0;
          padding: 0;
              background: #000;
                  overflow: hidden;
                      height: 100%;
                        }
                          canvas {
                              display: block;
                                  margin: 0 auto;
                                      background: #000;
                                        }
                                        </style>
                                        </head>
                                        <body>
                                        <canvas id="heart" width="800" height="800"></canvas>

                                        <script>
                                        const canvas = document.getElementById("heart");
                                        const ctx = canvas.getContext("2d");

                                        const W = canvas.width;
                                        const H = canvas.height;
                                        ctx.fillStyle = "black";
                                        ctx.fillRect(0, 0, W, H);

                                        ctx.fillStyle = "#ffb6c1";
                                        ctx.font = "bold 8px Arial";
                                        ctx.textAlign = "center";
                                        ctx.textBaseline = "middle";

                                        function goto(x, y) {
                                          return { cx: W / 2 + x, cy: H / 2 - y };
                                          }

                                          // Готовим список всех точек заранее
                                          const points = [];
                                          for (let scale = 11; scale < 17; scale++) {
                                            for (let i = 0; i < 120; i++) {
                                                const t = i * (Math.PI * 2) / 120;
                                                    const x = 16 * Math.pow(Math.sin(t), 3);
                                                        const y =
                                                              13 * Math.cos(t) -
                                                                    5 * Math.cos(2 * t) -
                                                                          2 * Math.cos(3 * t) -
                                                                                Math.cos(4 * t);
                                                                                    const { cx, cy } = goto(x * scale, y * scale);
                                                                                        points.push({ cx, cy });
                                                                                          }
                                                                                          }

                                                                                          let index = 0;

                                                                                          function drawNext() {
                                                                                            if (index >= points.length) {
                                                                                                // Когда всё нарисовано — добавляем большую надпись в центре
                                                                                                    ctx.save();
                                                                                                        ctx.fillStyle = "#ffb6c1";
                                                                                                            ctx.shadowColor = "#ff69b4";
                                                                                                                ctx.shadowBlur = 25;
                                                                                                                    ctx.font = "bold 48px Arial";
                                                                                                                        ctx.textAlign = "center";
                                                                                                                            ctx.textBaseline = "middle";
                                                                                                                                ctx.fillText("I love you Karina", W / 2, H / 2);
                                                                                                                                    ctx.restore();
                                                                                                                                        return;
                                                                                                                                          }

                                                                                                                                            const p = points[index];
                                                                                                                                              ctx.fillText("I love you", p.cx, p.cy);
                                                                                                                                                index++;

                                                                                                                                                  // Скорость анимации — чем меньше, тем быстрее
                                                                                                                                                    setTimeout(drawNext, 15);
                                                                                                                                                    }

                                                                                                                                                    // Запуск анимации
                                                                                                                                                    drawNext();
                                                                                                                                                    </script>
                                                                                                                                                    </body>
                                                                                                                                                    </html>
